name: Create issue on PR open

on:
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: read

jobs:
  create_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create a new issue
        run: |
          gh issue create \
            --title "New PR: ${{ github.event.pull_request.title }}" \
            --body "A new pull request has been opened: ${{ github.event.pull_request.html_url }}" \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
